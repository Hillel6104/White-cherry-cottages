<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cabins — White Cherry Cottages</title>
  <meta name="description" content="Sixteen family-friendly cabins in Bethlehem, NH — from one-room suites to roomy 3.5-room family cottages." />
  <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🍒</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/js/site.js"></script>
  <script>window.wccTailwindConfig();</script>
  <link rel="stylesheet" href="/assets/css/site.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body x-data="siteShell()" x-init="init()" class="bg-cream text-ink antialiased">

  <!-- Announcement bar -->
  <div x-cloak x-show="siteLoaded && bannerOpen && site.announcement && site.announcement.text"
       x-transition.opacity
       class="bg-sky-soft text-forest border-b border-sky/40">
    <div class="max-w-7xl mx-auto px-4 py-2.5 flex items-center justify-between gap-4 text-sm">
      <p class="flex-1 text-center sm:text-left">
        <span x-text="site && site.announcement ? site.announcement.text : ''"></span>
        <template x-if="site && site.announcement && site.announcement.link">
          <a :href="site.announcement.link" class="underline underline-offset-2 ml-2 font-medium hover:text-cherry"
             x-text="site.announcement.linkLabel || 'Learn more'"></a>
        </template>
      </p>
      <button @click="dismissBanner()" aria-label="Dismiss announcement" class="shrink-0 text-forest/70 hover:text-forest">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor"><path d="M4.3 4.3a1 1 0 011.4 0L10 8.6l4.3-4.3a1 1 0 111.4 1.4L11.4 10l4.3 4.3a1 1 0 01-1.4 1.4L10 11.4l-4.3 4.3a1 1 0 01-1.4-1.4L8.6 10 4.3 5.7a1 1 0 010-1.4z"/></svg>
      </button>
    </div>
  </div>

  <!-- Navigation -->
  <header class="sticky top-0 z-40 nav-glass border-b border-wood/10">
    <nav class="max-w-7xl mx-auto px-4 lg:px-6 h-20 flex items-center justify-between">
      <a href="/index.html" class="flex items-center gap-2 font-display text-xl text-ink min-w-0"
         :class="!siteLoaded && 'invisible'">
        <template x-if="site && site.logo">
          <img :src="site.logo" :alt="site.brand || 'White Cherry Cottages'"
               class="h-14 sm:h-16 w-auto max-w-[260px] object-contain" onerror="wccImgFallback(this)" />
        </template>
        <template x-if="!site || !site.logo">
          <span class="flex items-center gap-2">
            <span aria-hidden="true" class="text-cherry text-2xl">🍒</span>
            <span x-text="site && site.brand ? site.brand : 'White Cherry Cottages'"></span>
          </span>
        </template>
      </a>
      <ul class="hidden lg:flex items-center gap-7 text-sm font-medium">
        <li><a href="/index.html" class="hover:text-cherry" :class="isActive('/index.html') ? 'text-cherry' : 'text-ink/80'">Home</a></li>
        <li><a href="/cabins.html" class="hover:text-cherry" :class="isActive('/cabins.html') ? 'text-cherry' : 'text-ink/80'">Cabins</a></li>
        <li><a href="/amenities.html" class="hover:text-cherry" :class="isActive('/amenities.html') ? 'text-cherry' : 'text-ink/80'">Amenities</a></li>
        <li><a href="/gallery.html" class="hover:text-cherry" :class="isActive('/gallery.html') ? 'text-cherry' : 'text-ink/80'">Gallery</a></li>
        <li><a href="/contact.html" class="hover:text-cherry" :class="isActive('/contact.html') ? 'text-cherry' : 'text-ink/80'">Contact</a></li>
      </ul>
      <button @click="mobileNavOpen = !mobileNavOpen" class="lg:hidden p-2 rounded-md hover:bg-wood-light/40" aria-label="Open menu">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </nav>
    <div x-cloak x-show="mobileNavOpen" x-transition.origin.top class="lg:hidden border-t border-wood/10 bg-cream">
      <ul class="px-4 py-3 space-y-2 text-base">
        <li><a href="/index.html" class="block py-2">Home</a></li>
        <li><a href="/cabins.html" class="block py-2">Cabins</a></li>
        <li><a href="/amenities.html" class="block py-2">Amenities</a></li>
        <li><a href="/gallery.html" class="block py-2">Gallery</a></li>
        <li><a href="/contact.html" class="block py-2">Contact</a></li>
      </ul>
    </div>
  </header>

  <main x-data="cabinsPage()" x-init="load()">
    <!-- Header band -->
    <section class="bg-white border-b border-wood/10">
      <div class="max-w-7xl mx-auto px-4 lg:px-6 py-16 lg:py-20">
        <p class="uppercase tracking-[0.25em] text-xs text-wood mb-3">The cottages</p>
        <h1 class="font-display text-4xl lg:text-5xl leading-tight max-w-3xl"
            x-text="data && data.intro ? data.intro.heading : 'Sixteen cottages.'"></h1>
        <p class="mt-5 max-w-2xl text-ink/75 leading-relaxed"
           x-text="data && data.intro ? data.intro.body : ''"></p>

        <!-- Filter chips -->
        <div class="mt-8 flex flex-wrap gap-2">
          <template x-for="f in filters" :key="f.id">
            <button @click="activeFilter = f.id"
                    class="px-4 py-2 rounded-full text-sm border transition"
                    :class="activeFilter === f.id
                      ? 'bg-ink text-white border-ink'
                      : 'bg-cream text-ink/80 border-wood/20 hover:border-wood'">
              <span x-text="f.label"></span>
            </button>
          </template>
        </div>
      </div>
    </section>

    <!-- Cabin grid -->
    <section class="py-12 lg:py-16">
      <div class="max-w-7xl mx-auto px-4 lg:px-6">
        <p x-show="data && filteredCabins().length === 0" class="text-ink/60 py-12 text-center">
          No cabins match this size yet.
        </p>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 lg:gap-8">
          <template x-for="c in filteredCabins()" :key="c.slug">
            <article class="card-lift bg-white border border-wood/10 rounded-2xl overflow-hidden flex flex-col">
              <button class="block text-left" @click="openCabin(c)">
                <img :src="c.images && c.images[0]" :alt="c.name" onerror="wccImgFallback(this)"
                     class="w-full aspect-[4/3] object-cover" />
              </button>
              <div class="p-5 flex flex-col flex-1">
                <div class="flex items-center justify-between gap-3">
                  <h3 class="font-display text-xl" x-text="c.name"></h3>
                  <span class="shrink-0 inline-flex items-center px-2.5 py-1 rounded-full bg-wood-light/30 text-wood text-xs font-medium"
                        x-text="c.roomCount + (c.roomCount === 1 ? '-room' : '-room')"></span>
                </div>
                <p class="mt-1 text-xs uppercase tracking-[0.18em] text-wood">Sleeps <span x-text="c.sleeps"></span></p>
                <p class="mt-3 text-sm text-ink/75 leading-relaxed flex-1" x-text="c.shortDescription"></p>
                <div class="mt-4 flex flex-wrap gap-1.5">
                  <template x-for="feat in (c.features || []).slice(0, 3)" :key="feat">
                    <span class="inline-flex items-center px-2 py-0.5 rounded-full bg-cream border border-wood/15 text-xs text-ink/70" x-text="feat"></span>
                  </template>
                </div>
                <button @click="openCabin(c)" class="mt-5 inline-flex items-center text-cherry text-sm font-medium">
                  View details
                  <svg class="w-4 h-4 ml-1" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10.293 4.293a1 1 0 011.414 0l5 5a1 1 0 010 1.414l-5 5a1 1 0 01-1.414-1.414L13.586 11H4a1 1 0 110-2h9.586l-3.293-3.293a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
                </button>
              </div>
            </article>
          </template>
        </div>
      </div>
    </section>

    <!-- Modal -->
    <div x-cloak x-show="selected" x-transition.opacity
         @keydown.escape.window="closeCabin()"
         class="fixed inset-0 z-50 lightbox-shell flex items-center justify-center p-4">
      <div @click.outside="closeCabin()" class="bg-cream rounded-2xl shadow-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto">
        <template x-if="selected">
          <div>
            <div class="relative bg-ink/95">
              <img :src="selected.images && selected.images[activeImgIdx]" :alt="selected.name"
                   onerror="wccImgFallback(this)" class="w-full max-h-[70vh] object-contain mx-auto" />
              <button @click="closeCabin()" aria-label="Close" class="absolute top-3 right-3 bg-white/90 hover:bg-white p-2 rounded-full">
                <svg class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor"><path d="M4.3 4.3a1 1 0 011.4 0L10 8.6l4.3-4.3a1 1 0 111.4 1.4L11.4 10l4.3 4.3a1 1 0 01-1.4 1.4L10 11.4l-4.3 4.3a1 1 0 01-1.4-1.4L8.6 10 4.3 5.7a1 1 0 010-1.4z"/></svg>
              </button>
            </div>
            <template x-if="selected.images && selected.images.length > 1">
              <div class="flex gap-2 px-6 pt-4 overflow-x-auto">
                <template x-for="(img, i) in selected.images" :key="i">
                  <button @click="activeImgIdx = i" class="shrink-0 rounded-lg overflow-hidden border-2"
                          :class="activeImgIdx === i ? 'border-cherry' : 'border-transparent opacity-70'">
                    <img :src="img" alt="" onerror="wccImgFallback(this)" class="w-20 h-16 object-cover" />
                  </button>
                </template>
              </div>
            </template>
            <div class="p-6 lg:p-8">
              <div class="flex flex-wrap items-baseline justify-between gap-3">
                <h2 class="font-display text-3xl" x-text="selected.name"></h2>
                <p class="text-sm uppercase tracking-[0.18em] text-wood">
                  <span x-text="selected.roomCount"></span>-room · Sleeps <span x-text="selected.sleeps"></span>
                </p>
              </div>
              <p class="mt-4 text-ink/80 leading-relaxed" x-text="selected.longDescription"></p>
              <div class="mt-6">
                <p class="uppercase tracking-[0.2em] text-xs text-wood mb-2">In this cabin</p>
                <ul class="grid sm:grid-cols-2 gap-2 text-sm">
                  <template x-for="feat in (selected.features || [])" :key="feat">
                    <li class="flex items-start gap-2">
                      <svg class="w-4 h-4 mt-0.5 text-forest" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.7 5.3a1 1 0 010 1.4l-8 8a1 1 0 01-1.4 0l-4-4a1 1 0 111.4-1.4l3.3 3.3 7.3-7.3a1 1 0 011.4 0z" clip-rule="evenodd"/></svg>
                      <span x-text="feat"></span>
                    </li>
                  </template>
                </ul>
              </div>
              <a href="/contact.html" class="mt-7 inline-flex items-center px-5 py-2.5 rounded-full bg-cherry text-white hover:bg-cherry-dark transition">
                Reserve this cabin
              </a>
            </div>
          </div>
        </template>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-ink text-cream/85 mt-20">
    <div class="max-w-7xl mx-auto px-4 lg:px-6 py-14 grid md:grid-cols-3 gap-10">
      <div>
        <p class="font-display text-2xl text-white" x-text="site ? site.brand : 'White Cherry Cottages'"></p>
        <p class="mt-3 text-sm leading-relaxed text-cream/70" x-text="site ? site.footerBlurb : ''"></p>
      </div>
      <div>
        <p class="uppercase tracking-[0.2em] text-xs text-cream/60 mb-3">Visit</p>
        <ul class="space-y-1 text-sm">
          <li><a href="/index.html" class="hover:text-white">Home</a></li>
          <li><a href="/cabins.html" class="hover:text-white">Cabins</a></li>
          <li><a href="/amenities.html" class="hover:text-white">Amenities</a></li>
          <li><a href="/gallery.html" class="hover:text-white">Gallery</a></li>
          <li><a href="/contact.html" class="hover:text-white">Contact</a></li>
        </ul>
      </div>
      <div>
        <p class="uppercase tracking-[0.2em] text-xs text-cream/60 mb-3">Find us</p>
        <p class="text-sm" x-text="fullAddress()"></p>
        <p class="mt-2 text-sm"><a :href="site ? site.phoneHref : '#'" class="hover:text-white" x-text="site ? site.phone : ''"></a></p>
        <p class="text-sm"><a :href="site ? 'mailto:' + site.email : '#'" class="hover:text-white" x-text="site ? site.email : ''"></a></p>
      </div>
    </div>
    <div class="border-t border-white/10">
      <div class="max-w-7xl mx-auto px-4 lg:px-6 py-5 flex flex-col sm:flex-row justify-between gap-2 text-xs text-cream/60">
        <p>&copy; <span x-text="year"></span> <span x-text="site ? site.brand : ''"></span>. All rights reserved.</p>
        <p>Bethlehem, NH · White Mountains</p>
      </div>
    </div>
  </footer>

  <script>
    function cabinsPage () {
      return {
        data: null,
        activeFilter: 'all',
        selected: null,
        activeImgIdx: 0,
        filters: [
          { id: 'all', label: 'All cabins' },
          { id: '1', label: '1-room suites' },
          { id: '2', label: '2-room cottages' },
          { id: '3', label: '3+ room family' }
        ],
        async load () {
          try { this.data = await fetch('/data/cabins.json').then(r => r.json()); }
          catch (e) { console.error(e); }
        },
        filteredCabins () {
          if (!this.data || !this.data.cabins) return [];
          if (this.activeFilter === 'all') return this.data.cabins;
          if (this.activeFilter === '1') return this.data.cabins.filter(c => c.roomCount < 2);
          if (this.activeFilter === '2') return this.data.cabins.filter(c => c.roomCount >= 2 && c.roomCount < 3);
          if (this.activeFilter === '3') return this.data.cabins.filter(c => c.roomCount >= 3);
          return this.data.cabins;
        },
        openCabin (c) {
          this.selected = c;
          this.activeImgIdx = 0;
          document.documentElement.style.overflow = 'hidden';
        },
        closeCabin () {
          this.selected = null;
          document.documentElement.style.overflow = '';
        }
      };
    }
  </script>
</body>
</html>
