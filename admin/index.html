<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Content Manager — White Cherry Cottages</title>
  <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🍒</text></svg>" />

  <!-- Netlify Identity widget: handles owner login via email invite. -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <!-- Decap CMS (the modern, maintained fork of Netlify CMS). Reads admin/config.yml.
       Version is pinned deliberately. A range like ^3.0.0 lets unpkg serve whatever
       3.x is newest, so an upstream release can break this CMS with no change on our
       side — that is exactly what happened when 3.14.x shipped. Only bump this after
       testing the new version against /admin/. -->
  <script src="https://unpkg.com/decap-cms@3.12.2/dist/decap-cms.js"></script>

  <script>
    // When the user lands on /admin/ without being logged in, open the Identity
    // modal automatically. After login Decap CMS takes over the page.
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on('init', user => {
        if (!user) {
          window.netlifyIdentity.on('login', () => {
            document.location.href = '/admin/';
          });
        }
      });
    }
  </script>
</body>
</html>
